name: LearnLens backend tests

on:
  push:
    branches: ["learnlens"]
  pull_request:
    branches: ["learnlens"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: learnlens_ci
      DEMO_STUDENT_EMAIL: demo.student@example.com
      DEMO_STUDENT_PASSWORD: TestPassword123!
      DEMO_TEACHER_EMAIL: demo.teacher@example.com
      DEMO_TEACHER_PASSWORD: TestPassword123!
      TEACHER_VERIFICATION_CODE: CI-TEACHER-CODE
      CORS_ORIGINS: http://localhost:3000
      BACKEND_URL: http://127.0.0.1:8001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Start backend
        run: |
          uvicorn server:app --host 0.0.0.0 --port 8001 > /tmp/learnlens-backend.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/api/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8001/api/health

      - name: Run configured pytest suite
        run: pytest

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: learnlens-backend-log
          path: /tmp/learnlens-backend.log
