name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6

    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: learnlens
      AUTH_COOKIE_NAME: learnlens_session
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DEMO_STUDENT_EMAIL: student@learnlens.demo
      DEMO_STUDENT_PASSWORD: LearnLens#Student1
      DEMO_TEACHER_EMAIL: teacher@learnlens.demo
      DEMO_TEACHER_PASSWORD: LearnLens#Teacher1
      TEACHER_VERIFICATION_CODE: LearnLens#Teacher1
      BACKEND_URL: http://127.0.0.1:8001

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Install dependencies
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend + E2E dependencies
        run: |
          npm ci --prefix frontend
          npm install --prefix tests
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: tests

      # MongoDB is provided by the service container above (step 3).
      # 4. Start backend
      - name: Start backend
        run: |
          cd backend
          uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/backend.log 2>&1 &
      # 5. Wait for backend health/readiness
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/api/health | grep -q '"mongo":"up"'; then
              echo "backend ready"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become ready"; cat /tmp/backend.log; exit 1

      # 6. Run backend tests
      - name: Backend tests
        run: python -m pytest
        working-directory: backend

      # 7. Build frontend
      - name: Reset database before E2E
        run: |
          python - <<'PY'
          import os
          from pymongo import MongoClient
          client = MongoClient(os.environ["MONGO_URL"])
          client.drop_database(os.environ["DB_NAME"])
          client.close()
          PY
          kill $(pgrep -f "uvicorn server:app" | head -n 1) || true
          cd backend
          uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/backend.log 2>&1 &
          cd ..
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/api/health | grep -q '"mongo":"up"'; then
              echo "backend reseeded and ready"; exit 0
            fi
            sleep 2
          done
          echo "backend did not recover after database reset"; cat /tmp/backend.log; exit 1

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend
      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # 8-10. Start frontend (Vite dev server proxies /api to the backend) and wait
      - name: Start frontend
        run: |
          cd frontend
          npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/frontend.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000 > /dev/null; then echo "frontend ready"; exit 0; fi
            sleep 2
          done
          echo "frontend did not become ready"; cat /tmp/frontend.log; exit 1

      # 11. Run Playwright
      - name: Playwright E2E
        run: npx playwright test
        working-directory: tests

      # 12. Collect reports
      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/backend.log
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/test-results
          if-no-files-found: ignore
